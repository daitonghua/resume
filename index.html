<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#002fa7">
<title>戴瞳华 · 算法工程师 · 算法-硬件协同设计 · 通信博士生</title>
<meta name="description" content="戴瞳华 · 算法工程师 · 算法-硬件协同设计 · 通信博士生">
<style>
:root{
  --ink:#16181d; --muted:#6b7280; --faint:#9aa1ad; --line:#e7e9ee;
  /* 克莱因蓝（International Klein Blue, #002FA7）：三语统一主色。
     语言主题只改强调色深浅的用法，不再按语言换色系 —— 见 LANG_THEME。 */
  --accent:#002fa7; --accent-soft:#eaeefb; --bg:#fbfbfc; --card:#ffffff;
  --maxw:860px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  font-family:"Inter","Segoe UI",-apple-system,BlinkMacSystemFont,"Helvetica Neue",
              "PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  color:var(--ink); background:var(--bg); line-height:1.62;
  font-size:15px; -webkit-font-smoothing:antialiased;
}
.wrap{max-width:var(--maxw);margin:0 auto;padding:34px 34px 72px}
a{color:inherit;text-decoration:none}
a:hover{color:var(--accent)}

/* ---------- 控制条 ---------- */
.bar{
  position:sticky; top:0; z-index:50; backdrop-filter:saturate(180%) blur(12px);
  background:rgba(251,251,252,.86); border-bottom:1px solid var(--line);
}
.bar-in{max-width:var(--maxw);margin:0 auto;padding:9px 22px;display:flex;gap:12px;align-items:center;flex-wrap:nowrap}
.bar-group{display:flex;gap:6px;align-items:center;flex:0 0 auto}
.bar-label{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);font-weight:600}
.bar-sep{width:1px;height:20px;background:var(--line);flex:0 0 auto}
/* 栏目导航必须保持一行：宽度不够时横向滚动，而不是折到第二行。
   （折行会把顶栏撑高、吸顶后遮挡内容；用户报过"换语言就掉到第二行"。） */
.bar-nav{display:flex;gap:2px;align-items:center;flex:1 1 auto;min-width:0;overflow-x:auto;scrollbar-width:none}
.bar-nav::-webkit-scrollbar{display:none}
.bar-nav a{
  font-size:12.5px;color:var(--muted);white-space:nowrap;padding:4px 9px;border-radius:6px;transition:.14s;flex:0 0 auto;
}
.bar-nav a:hover{color:var(--ink);background:var(--accent-soft)}
.bar-nav a.on{color:var(--accent);background:var(--accent-soft);font-weight:600}
.seg{display:flex;background:var(--accent-soft);border-radius:999px;padding:3px;flex:0 0 auto}
.seg button{
  font:inherit;font-size:12.5px;font-weight:600;color:var(--muted);background:none;border:0;
  padding:4px 12px;border-radius:999px;cursor:pointer;transition:.16s;
}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--card);color:var(--accent);box-shadow:0 1px 3px rgba(16,24,40,.10)}
select{
  font:inherit;font-size:12.5px;font-weight:600;color:var(--ink);background:var(--card);
  border:1px solid var(--line);border-radius:8px;padding:5px 9px;cursor:pointer;
}
select:hover{border-color:var(--accent)}
.bar-right{margin-left:auto;display:flex;gap:10px;align-items:center;flex:0 0 auto}
/* 这里原本是版本下拉（select）、打印按钮与版本目标提示的样式，
   三者随内部版本控件一起删除：页面上不再有版本切换与打印入口。 */

/* ---------- 页头 ---------- */
.hdr{display:flex;gap:26px;align-items:center;padding:8px 0 26px;border-bottom:1px solid var(--line)}
.hdr .photo{
  width:104px;height:104px;border-radius:50%;overflow:hidden;flex:0 0 auto;
  background:var(--accent-soft);box-shadow:0 2px 10px rgba(16,24,40,.10);
}
.hdr .photo img{width:100%;height:100%;object-fit:cover;display:block}
.hdr h1{font-size:31px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.hdr .role{color:var(--accent);font-weight:600;font-size:14.5px;margin-top:5px}
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:11px;font-size:13px;color:var(--muted)}
.meta span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.meta svg{width:13px;height:13px;flex:0 0 auto;stroke:var(--faint);fill:none;stroke-width:1.7}
.meta a:hover{color:var(--accent)}

/* ---------- 区块 ---------- */
.section{margin-top:34px}
/* 锚点跳转补偿：吸顶栏会遮挡板块标题，用 scroll-margin-top 预留出栏高
   （覆盖直接打开 #sec-xxx 深链接的情形；点击导航则用 JS 精确滚动） */
.section[id]{scroll-margin-top:72px}
.section>h2{
  font-size:14px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--accent);margin-bottom:15px;
}
.section>h2::after{content:"";display:block;height:1px;background:var(--line);margin-top:8px}

.bul.core li{font-size:14.5px;background:var(--accent-soft);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:11px 15px}
.bul.core li strong{font-weight:700}

  flex:1 1 190px;background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:14px 16px;transition:.16s;
}

/* 条目 */
.entry{margin-bottom:16px}
.entry:last-child{margin-bottom:0}
/* 条目标题上方留出空间：上一段落与"黑色加粗标题"之间需要一点呼吸感，
   而紧贴标题的下一行（蓝色副标题/机构）要贴住，不能再占空隙。 */
.entry-head{display:flex;justify-content:space-between;gap:14px;align-items:baseline;flex-wrap:wrap;margin-top:14px}
.entry:first-child .entry-head{margin-top:2px}
.entry-head .t{font-size:16.5px;font-weight:650;letter-spacing:-.01em}
.entry-head .d{font-size:12.5px;color:var(--faint);white-space:nowrap;font-variant-numeric:tabular-nums}
/* 蓝色副标题（机构/学校）：上边距收掉，空隙交给标题上方的 margin-top 承担 */
.entry .org{font-size:13.5px;color:var(--accent);font-weight:500;margin-top:1px}
.entry .org a:hover{text-decoration:underline}
.fact{font-size:13px;color:var(--muted);margin-top:3px}
.fact b{color:var(--ink);font-weight:600}
/* 要点区与黑色加粗标题（.block-h）上方留空：条目标题的行内间距已收在 .entry-head 上，
   这里给"加粗小标题"再让出一点空间。 */
.block{margin-top:7px}
.block:first-of-type{margin-top:5px}
.block-h{font-size:13.5px;font-weight:650;margin:0 0 4px}
ul.bul{list-style:none;display:flex;flex-direction:column;gap:5px}
ul.bul li{font-size:14px;padding-left:15px;position:relative;color:#2b303a}
ul.bul li::before{content:"";position:absolute;left:2px;top:.63em;width:4px;height:4px;border-radius:50%;background:var(--faint)}
/* 条目的要点整组缩进一格，与条目头（学位/职位那一行）形成从属关系 */
.block>ul.bul{margin-left:14px}
ul.bul li strong{font-weight:650;color:var(--ink)}
ul.bul li em{font-style:italic}
/* 子级要点（数据里 sub:true）：作为母项 <li> 里的**嵌套列表**，缩进 + 字号小一号。
   用于科研项目里"首个…"这类支撑性成果 —— 视觉上服从于课题本身。 */
ul.bul ul.bul.sub{margin:5px 0 2px 6px;gap:3px}
ul.bul ul.bul.sub li{font-size:12.5px;color:var(--muted);padding-left:12px}
ul.bul ul.bul.sub li::before{left:0;top:.6em;width:3px;height:3px}
ul.bul ul.bul.sub li strong{font-weight:600}
/* 深子级（style:"sub2"，如四条"首个…"）：在轻子级之上再缩进一格、字号再小一号。
   这条曾被我漏写 —— 于是四个"首个…"落回通用 ul.bul li 的 14px，看起来和正文一样大、
   完全看不出层级（用户反馈"不显示"就是这个）。选择器要带上 .sub2，别再漏。 */
ul.bul ul.bul.sub.sub2{margin:3px 0 0 10px;gap:2px}
ul.bul ul.bul.sub.sub2 li{font-size:11.5px;color:var(--faint);padding-left:11px}
ul.bul ul.bul.sub.sub2 li::before{left:0;top:.58em;width:3px;height:3px}
.award{margin-top:10px;font-size:13px;color:var(--muted)}
.award b{color:var(--ink);font-weight:600}
.link-inline{font-size:13px;color:var(--accent)}

/* 技能 */
.skill-group{display:grid;grid-template-columns:82px 1fr;gap:6px 16px;padding:9px 0;border-bottom:1px dashed var(--line)}
.skill-group:last-child{border-bottom:0}
.skill-area{font-size:12px;font-weight:650;color:var(--faint);letter-spacing:.05em;text-transform:uppercase;padding-top:3px}
.skill-items{display:flex;flex-wrap:wrap;gap:7px}
.chip{display:inline-flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px 11px;font-size:13px}
.chip .dots{display:inline-flex;gap:2px}
.chip .dots i{width:5px;height:5px;border-radius:50%;background:var(--line);display:block}
.chip .dots i.f{background:var(--accent)}
.chip .note{color:var(--faint);font-size:11.5px}

/* 论文 */
.pub-kind{font-size:12.5px;font-weight:650;color:var(--muted);margin:14px 0 6px}
.pub-kind:first-child{margin-top:0}
ol.pubs{list-style:none;counter-reset:p}
ol.pubs li{counter-increment:p;font-size:13.5px;padding-left:24px;position:relative;margin-bottom:7px;color:#2b303a}
ol.pubs li::before{content:"[" counter(p) "]";position:absolute;left:0;color:var(--faint);font-size:12px;font-variant-numeric:tabular-nums}
ol.pubs li em{font-style:italic}
.comp-item{margin-bottom:13px}
.comp-item .n{font-size:14px;font-weight:650}
.comp-item .n .yr{color:var(--faint);font-weight:500;font-size:12.5px;margin-left:7px}
.comp-item .dt{font-size:13.5px;color:var(--muted);margin-top:2px}

/* 课程：作为"上一个学位条目"的子块呈现。
   数据里课程块紧跟在对应学位之后（edu.mipt.ms → courses.mipt.ms），
   这里用缩进 + 浅底 + 左侧引导线把它与学位条目的从属关系表达清楚。 */
details.courses{
  margin:10px 0 2px 14px;padding-left:12px;border-left:2px solid var(--accent-soft);
}
details.courses>summary{
  cursor:pointer;list-style:none;padding:5px 0;font-size:12.5px;font-weight:600;color:var(--accent);
  display:flex;justify-content:space-between;align-items:center;gap:10px;
}
details.courses>summary::-webkit-details-marker{display:none}
details.courses>summary::after{content:"＋";color:var(--accent);font-weight:700}
details.courses[open]>summary::after{content:"－"}
details.courses .body{padding:2px 0 6px;font-size:12.5px;color:var(--muted);line-height:1.75}
/* 课程两级：总名加粗成行，分名缩进 —— 让"数学分析"与它下面的四门课看出归属 */
.course-group{margin-top:9px}
.course-group:first-child{margin-top:2px}
.course-name{font-weight:650;color:var(--ink);font-size:12.5px}
.course-list{padding-left:13px;border-left:2px solid var(--line);margin-top:2px;color:var(--muted)}

.footer{margin-top:44px;padding-top:18px;border-top:1px solid var(--line);font-size:12px;color:var(--faint);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* 静态版本页：无控制条，回归纯简历 */
body.static .wrap{padding-top:40px}
body.static .footer{margin-top:34px}

/* 宽屏利用：按屏幕宽度放宽内容区，避免大屏两侧大片留白。
   不无限拉伸 —— 行宽过大会降低可读性（长行返回扫视困难）。
   1600px 以上走"内容 + 侧栏导航"两栏，信息密度更高。 */
@media (min-width:1180px){ :root{--maxw:1040px} }
@media (min-width:1500px){ :root{--maxw:1200px} }
@media (max-width:640px){
  .wrap{padding:22px 15px 56px}
  .hdr{gap:18px}
  .hdr .photo{width:76px;height:76px}
  .hdr h1{font-size:24px}
  .skill-group{grid-template-columns:1fr;gap:4px}
  .bar-in{padding:9px 15px;gap:10px}
  /* 窄屏：控制条分两行，栏目导航单独占一行并横向滑动 */
  .bar-sep{display:none}
  .bar-nav{order:3;flex:1 1 100%;flex-wrap:nowrap}
  .bar-right{margin-left:auto;gap:8px}
  .dl{padding:5px 10px;font-size:12px}
  .section[id]{scroll-margin-top:104px}
}

@media print{
  /* A4 要在样式里定死：否则纸张大小取决于打印对话框的默认值，
     某些系统默认 Letter，页边距与页码位置会跟着错。 */
  @page{size:A4;margin:12mm}
  :root{--bg:#fff;--card:#fff}
  body{font-size:10.4pt;background:#fff}
  .bar{display:none!important}
  .wrap{max-width:none;margin:0;padding:0}
  a{text-decoration:none}
  /* 课程清单在打印时必须展开，否则内容会被折叠吞掉 */
  details.courses{border:0}
  details.courses>summary{padding:0 0 4px;font-weight:700}
  details.courses>summary::after{display:none}
  details.courses>.body{display:block!important}
  /* 分页控制：整条不跨页，但板块标题后不要立刻分页（避免孤立标题） */
  .section{break-inside:auto}
  .entry,.stat,.comp-item,.skill-group,.award,.bul.core li{break-inside:avoid}
  .section>h2{break-after:avoid}
  .entry-head{break-after:avoid}
  .org,.block-h{break-after:avoid}
  h1,h2{break-after:avoid}
}

/* PDF 下载入口：放在顶栏右侧（原打印按钮的位置） */
.dl-slot{display:flex;align-items:center}
.dl{
  display:inline-flex;align-items:center;gap:7px;
  font-size:13px;font-weight:600;color:var(--accent);
  background:var(--accent-soft);border:1px solid transparent;border-radius:9px;
  padding:6px 13px;transition:.16s;white-space:nowrap;
}
.dl:hover{background:var(--card);border-color:var(--accent);text-decoration:none}
.dl svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

@media print{
  /* 顶栏打印时整体隐藏（.bar{display:none}），无需单独处理下载按钮 */
}

<script id="resume-data" type="application/json">{"nodes":{"comp.algorithm":{"type":"bullet","level":1,"tags":["quant","asic"],"text":{"zh":"\u003cstrong>量化算法\u003c/strong>：模型 / 信号量化全链路 —— 混合精度量化、量化感知训练（QAT）、改进量化算子、梯度和迭代优化器状态压缩；对参数、信号通路、存储、梯度、优化器位宽统一优化，相对工程化基线无损降到 X bit。","en":"\u003cstrong>Quantization algorithms\u003c/strong>: end-to-end model / signal quantization — mixed-precision quantization, quantization-aware training (QAT), improved quantization operators, gradient and iterative optimizer-state compression; unified bit-width optimization across parameters, signal path, storage, gradients and optimizer, losslessly down to X bit versus the engineering baseline.","ru":"\u003cstrong>Алгоритмы квантования\u003c/strong>: полный цикл квантования моделей и сигналов — смешанная точность, обучение с учётом квантования (QAT), улучшенные операторы квантования, сжатие градиентов и состояния итерационного оптимизатора; единая оптимизация разрядности параметров, тракта, памяти, градиентов и оптимизатора, без потерь до X бит."}},"comp.coDesign":{"type":"bullet","level":1,"tags":["rtl","asic","fpga","dpd"],"text":{"zh":"\u003cstrong>芯片设计\u003c/strong>：以芯片 PPA 为目标的算法-硬件协同设计，受 ASIC 资源约束驱动方案取舍；负责近似计算与近似算子的无损低成本低功耗方案，参与 RTL 实现与 FPGA（FPGA + ROC）算法验证平台的改进调试，贯通「算法 → RTL → FPGA 验证」链路；中射频非线性补偿（DPD）模型的量化即在此约束下落地。","en":"\u003cstrong>Chip design\u003c/strong>: PPA-driven algorithm–hardware co-design, with scheme trade-offs forced by ASIC resource limits; lossless low-cost low-power schemes based on approximate computing and approximate operators; contributed to RTL implementation and to the FPGA (+ ROC) algorithm verification platform, spanning the algorithm → RTL → FPGA chain. RF nonlinear-compensation (DPD) model quantization lands under exactly these constraints.","ru":"\u003cstrong>Проектирование чипов\u003c/strong>: алгоритмо-аппаратный со-дизайн с ориентацией на PPA, компромиссы определяются ограничениями ASIC; безошибочные низкозатратные схемы на основе приближённых вычислений; al path, storage and optimizer for the online-training model, keeping convergence fast at low bit-width.","ru":"Реализовал единую оптимизацию разрядности «параметры / тракт / память / оптимизатор» для модели онлайн-обучения, обеспечив быструю сходимость при низкой разрядности."}},{"level":1,"tags":["approx","asic"],"text":{"zh":"负责基于近似计算与近似算子的无损低成本低功耗方案，负责 ASIC 团队前沿方向探索并与当地科研团队合作调研。","en":"Owned lossless low-cost, low-power schemes based on approximate computing and approximate operators; led ASIC frontier exploration with local academic collaborators.","ru":"Отвечал за безошибочные низкозатратные схемы на основе приближённых вычислений; вёл исследование фронтира ASIC с местными научными командами."}},{"level":2,"tags":["rtl","fpga"],"text":{"zh":"参与 FPGA + ROC 算法验证平台的版本改进与调试，贯通「算法 → RTL → FPGA 验证」链路。","en":"Contributed to version improvements and debugging of the FPGA + ROC algorithm verification platform, spanning the algorithm → RTL → FPGA verification chain.","ru":"Участвовал в доработке и отладке платформы верификации FPGA + ROC: цепочка «алгоритм → RTL → FPGA»."}}]}]},"job.hse":{"type":"job","level":1,"tags":["sensing","comm","teach"],"title":{"zh":"受邀讲师","en":"Invited Lecturer","ru":"Приглашённый преподаватель"},"org":{"zh":"俄罗斯高等经济大学（HSE）","en":"HSE University","ru":"НИУ ВШЭ"},"date":{"zh":"2025.01 – 2025.07","en":"Jan 2025 – Jul 2025","ru":"янв. 2025 – июл. 2025"},"link":{"href":"https://www.hse.ru/en/edu/courses/904327944","label":{"zh":"课程链接","en":"course page","ru":"страница курса"}},"blocks":[{"id":"teach","level":1,"tags":["teach"],"bullets":[{"level":1,"tags":["teach"],"text":{"zh":"独立授课 \u003cem>Systems and Networks of Information Transfer\u003c/em>（各类通信网络构建原理与基础数据传输协议），俄语 / 英语双语教学。","en":"Sole lecturer of \u003cem>Systems and Networks of Information Transfer\u003c/em> (principles of communication networks and basic data-transfer protocols), taught bilingually in Russian and English.","ru":"Самостоятельно вёл курс \u003cem>Systems and Networks of Inf     // 裁剪版 PDF 不发布——那是我按岗位裁剪用的内部版本。
    var pdfName = { zh: '简历-完整版-中文.pdf', en: 'Resume-Full-English.pdf', ru: 'Резюме-полное-русский.pdf' }[lang];
    var pdfSign = { zh: '下载 PDF 简历', en: 'Download PDF resume', ru: 'Скачать резюме в PDF' }[lang];
    if (pdfName) {
      document.getElementById('docDownload').innerHTML =
        '<a class="dl" href="dist/resume-full.' + lang + '.pdf" download="' + esc(pdfName) + '">' +
        '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0 4-4m-4 4-4-4M4 19h16"/></svg>' +
        esc(pdfSign) + '</a>';
    }
    var up = {zh:'更新于 ',en:'Updated ',ru:'Обновлено '}[lang] + "2026-10";
    // 页脚只显示更新日期：页面不出现任何版本名（内部裁剪版只存在于构建工具的 PDF 里）
    document.getElementById('docFoot').innerHTML = '<footer class="footer"><span></span><span>'+esc(up)+'</span></footer>';

    // 语言按钮的高亮：三语都是完整内容，都对访客可用
    // 语言按钮对所有访客都可用：对外只有完整版，三语都是完整内容
    document.querySelectorAll('#langSeg button').forEach(function(b){
      var ok = ['zh','en','ru'].indexOf(b.dataset.lang) >= 0;
      b.disabled = !ok; b.style.opacity = ok ? 1 : .35;
      b.classList.toggle('on', b.dataset.lang === lang);
    });
    // URL 只同步语言参数（可分享"英文版直链"）
    var u2 = new URL(location.href);
    if (lang === 'zh') u2.searchParams.delete('lang'); else u2.searchParams.set('lang', lang);
    history.replaceState(null,'',u2);
  }

  document.getElementById('langSeg').addEventListener('click', function(e){
    if(e.target.tagName === 'BUTTON' && !e.target.disabled){ lang = e.target.dataset.lang; render(); }
  });
  // 语言切换是顶栏唯一的交互（下载按钮是普通链接，无需绑定）

  // 滚动高亮 + 点击跳转。
  // 位置判定必须用 getBoundingClientRect()，不能用 offsetTop ——
  // offsetTop 是相对"最近的定位祖先"的偏移，祖先一旦有 position 就会算错，
  // 表现为"滚动时高亮不跟随"（用户报过的问题）。
  (function(){
    var navEl = document.getElementById('sectionNav');
    var activeHref = null;

    function barOffset(){
      var b = document.getElementById('bar');
      return (b ? b.getBoundingClientRect().height : 0) + 10;
    }
    // 返回当前应高亮的 href：所有"已越过吸顶栏"的板块里，位置最靠下的那个
    function currentHref(){
      var links = navEl.querySelectorAll('a');
      if (!links.length) return null;
      var limit = barOffset() + 4;
      var best = null, bestTop = -Infinity;
      for (var i = 0; i < links.length; i++){
        var href = links[i].getAttribute('href') || '';
        // href 形如 "#sec-xxx"：去掉第一个字符 '#' 就得到锚点 id。
        // 曾经写成 slice(3)（去掉 "#se"），拼出来是 "secc-xxx"，getElementById 恒为 null
        // —— 于是每滚到哪儿都只会 fallback 成"高亮第一项"。用户报的"滑动时没有高亮"就是这个。
        var sec = document.getElementById(href.slice(1));
        if (!sec) continue;
        var top = sec.getBoundingClientRect().top;
        if (top <= limit && top > bestTop){ bestTop = top; best = href; }
      }
      return best || (links[0].getAttribute('href') || null);   // 还没滚到第一个板块时高亮首项
    }
    function apply(href){
      if (href === activeHref) return;
      var links = navEl.querySelectorAll('a');
      var hit = null;
      for (var i = 0; i < links.length; i++){
        var on = (links[i].getAttribute('href') === href);
        if (on) hit = links[i];
        if (links[i].classList && links[i].classList.toggle) links[i].classList.toggle('on', on);
        else links[i].className = on ? 'on' : '';
      }
      // 窄屏下整条导航会横向溢出（只能滚），高亮项可能滚出可视区，
      // 看起来就"没有高亮"。仅在这种情况下把它带进视野（避免每次滚动都动页面）。
      if (hit && hit.scrollIntoView && navEl.scrollWidth > navEl.clientWidth + 4) {
        try { hit.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' }); } catch (_) {}
      }
      activeHref = href;
    }
    function syncNav(){ apply(currentHref()); }

    navEl.addEventListener('click', function(e){
      var a = e.target.closest ? e.target.closest('a') : null;
      if(!a) return;
      var href = a.getAttribute('href') || '';
      var sec = document.getElementById(href.slice(1));
      if(!sec) return;
      e.preventDefault();
      var y = window.pageYOffset + sec.getBoundingClientRect().top - barOffset();
      window.scrollTo({ top: Math.max(0, y), behavior: 'smooth' });
      history.replaceState(null, '', href);
      apply(href);            // 点击后立即反馈，不等 scroll 事件
    });

    window.__syncNav = syncNav;
    window.__navCurrent = currentHref;   // 供测试直接问"现在该高亮谁"
    window.addEventListener('scroll', syncNav, { passive: true });
    window.addEventListener('resize', syncNav);
    window.addEventListener('hashchange', syncNav);
    syncNav();
  })();

  render();
  if(q.get('print') === '1') setTimeout(function(){ window.print(); }, 350);
})();
</script>
</body>
</html>
